<?xml version="1.0" encoding="UTF-8"?>
<!--
  LA MARQUE, EN VERSION D'ICÔNE.

  Elle reprend le tracé de `src/ui/logo.tsx` — une étiquette au coin coupé,
  portant un L — et rien d'autre. C'est la correction d'un défaut que l'ancien
  fichier documentait sans le nommer : l'assiette de porcelaine y était
  redessinée « distinctement » parce que ses quatre zones concentriques
  disparaissaient sous vingt pixels. Deux dessins pour une marque, c'est une
  marque qu'on ne reconnaît pas.

  Le dessin est désormais LE MÊME aux deux échelles. C'est ce que permet une
  silhouette pleine sans détail interne, et c'est la raison pour laquelle toutes
  les grandes applications en ont une.

  ⚠️ LES DÉGRADÉS SONT APLATIS EN COULEURS PLEINES ICI, délibérément. À 16 px un
  dégradé sur trente-deux pixels de diagonale ne se voit pas, et resvg le rend
  en dégradant la compression du PNG. On garde le bleu médian, qui est la
  couleur que l'œil retient de toute façon.
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Letikette">
	<path
		d="M22 4 H62 L96 38 V78 A18 18 0 0 1 78 96 H22 A18 18 0 0 1 4 78 V22 A18 18 0 0 1 22 4 Z"
		fill="#2f4fd8"
	/>
	<path d="M62 4 L96 38 H70 A8 8 0 0 1 62 30 Z" fill="#ffffff" fill-opacity="0.28" />
	<path d="M34 26 H46 V62 H70 V74 H34 Z" fill="#ffffff" />
</svg>
